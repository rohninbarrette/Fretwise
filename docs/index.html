<!doctype html>
<html lang="en-CA">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Fretwise</title>
<meta name="description" content="Guitar chord finder, chord library, scales, circle of fifths, song sketchpad, tuner and practice tools.">
<meta name="theme-color" content="#eceee9" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#121513" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Fretwise">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<style>html,body{margin:0;padding:0}</style>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
/* Layout: header (brand, tuning chip, six tabs). Finder = fretboard + results; Chords = search + letter tabs + cards;
   Scales = letter tabs + cards; Keys = wheel + key info; Song = chord sheet + solo helper; Practice = four tool cards. */
:root{
  --bg:#eceee9; --surface:#fbfbf8; --surface-2:#f2f3ef; --ink:#1a1d1b; --muted:#5d655f; --line:#d3d8d1;
  --accent:#17655d; --accent-fg:#ffffff; --accent-soft:#d6e8e3;
  --dot:#1a1d1b; --dot-fg:#fbfbf8; --string:#8d948e; --fret:#b9bfb8; --nut:#2a2e2b; --inlay:#e3e6e0; --board:#ffffff;
  --warn:#7d5300; --warn-soft:#f3e7cb; --scale-dot:#8ea49f; --scale-fg:#ffffff;
  --star:#a46b00; --bad:#a63a2b; --bad-soft:#f4dcd6;
  --f-display:"Bricolage Grotesque","Avenir Next",system-ui,sans-serif;
  --f-body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#121513; --surface:#1a1e1c; --surface-2:#222724; --ink:#e6ebe7; --muted:#9aa39d; --line:#323935;
  --accent:#5cc2b5; --accent-fg:#0c1412; --accent-soft:#1c3934;
  --dot:#e6ebe7; --dot-fg:#121513; --string:#7a827c; --fret:#4a524d; --nut:#c9cfca; --inlay:#262c29; --board:#171a19;
  --warn:#e3b65e; --warn-soft:#3a3020; --scale-dot:#4b6964; --scale-fg:#e6ebe7; color-scheme:dark;
  --star:#f0c050; --bad:#ef8b7a; --bad-soft:#3d2420;
}}
:root[data-theme="dark"]{
  --bg:#121513; --surface:#1a1e1c; --surface-2:#222724; --ink:#e6ebe7; --muted:#9aa39d; --line:#323935;
  --accent:#5cc2b5; --accent-fg:#0c1412; --accent-soft:#1c3934;
  --dot:#e6ebe7; --dot-fg:#121513; --string:#7a827c; --fret:#4a524d; --nut:#c9cfca; --inlay:#262c29; --board:#171a19;
  --warn:#e3b65e; --warn-soft:#3a3020; --scale-dot:#4b6964; --scale-fg:#e6ebe7; color-scheme:dark;
  --star:#f0c050; --bad:#ef8b7a; --bad-soft:#3d2420;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.5}
.wrap{max-width:1120px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-top:max(20px,env(safe-area-inset-top,0px));padding-bottom:48px}
button{font:inherit;color:inherit;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
html{-webkit-text-size-adjust:100%}
html.locked,html.locked body{overflow:hidden}
.tab svg{display:none;width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round}
button:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
h1,h2,h3{font-family:var(--f-display);text-wrap:balance;margin:0}
.mono{font-family:var(--f-mono)}

/* header */
.top{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px 24px;margin-bottom:20px}
.brand{display:flex;align-items:baseline;gap:10px}
.brand h1{font-size:28px;font-weight:700;letter-spacing:-.01em}
.brand span{color:var(--muted);font-size:13px}
.tabs{display:flex;gap:4px;background:var(--surface-2);border:1px solid var(--line);border-radius:10px;padding:4px}
.tab{border:0;background:none;padding:7px 14px;border-radius:7px;cursor:pointer;font-weight:500;color:var(--muted)}
.tab[aria-selected="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.08)}

/* buttons, chips */
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:6px 12px;cursor:pointer;font-size:14px;font-weight:500}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-fg)}
.btn svg{width:14px;height:14px;fill:currentColor}
.chip{font-size:11px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;padding:2px 8px;border-radius:99px;white-space:nowrap}
.chip.ok{background:var(--accent-soft);color:var(--accent)}
.chip.part{background:var(--warn-soft);color:var(--warn)}
.label{font-size:11px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}

/* finder */
.finder{display:grid;grid-template-columns:auto minmax(0,1fr);gap:28px;align-items:start}
@media (max-width:760px){.finder{grid-template-columns:minmax(0,1fr)}}
.board-col{display:flex;flex-direction:column;gap:12px;align-items:center}
.board{--cw:min(46px,calc((100vw - 100px) / 6));background:var(--board);border:1px solid var(--line);border-radius:12px;padding:10px 14px 12px 6px;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
.b-row{display:flex;align-items:stretch}
.b-lab{width:30px;flex:none;display:flex;align-items:center;justify-content:flex-end;padding-right:10px;font-family:var(--f-mono);font-size:13px;color:var(--muted)}
.b-seg{position:relative;display:grid;grid-template-columns:repeat(6,var(--cw))}
.b-fret .b-seg{border-bottom:3px solid var(--fret)}
.b-head .b-seg{border-bottom:7px solid var(--nut)}
.b-names span,.b-foot span{text-align:center;font-family:var(--f-mono);font-size:12px;color:var(--muted)}
.b-foot span{font-size:14px;font-weight:600;color:var(--ink);padding-top:6px}
.b-foot span.off{color:var(--muted);font-weight:400}
.b-top{border:0;background:none;height:38px;cursor:pointer;font-family:var(--f-mono);font-size:18px;color:var(--muted);border-radius:6px}
.b-top:hover{background:var(--surface-2)}
.b-top.open{color:var(--ink)}
.b-cell{position:relative;border:0;background:none;padding:0;cursor:pointer;z-index:1}
.b-cell::before{content:"";position:absolute;left:50%;top:0;bottom:-3px;width:var(--sw);transform:translateX(-50%);background:var(--string)}
.inlay{position:absolute;top:50%;width:12px;height:12px;border-radius:50%;background:var(--inlay);transform:translate(-50%,-50%);z-index:0}
.dot,.ghost{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:32px;height:32px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-family:var(--f-mono);font-size:12px;font-weight:600}
.dot{background:var(--dot);color:var(--dot-fg)}
.dot.root{background:var(--accent);color:var(--accent-fg)}
.ghost{opacity:0;border:1.5px dashed var(--muted);color:var(--muted);background:var(--board)}
@media (hover:hover){.b-cell:hover .ghost{opacity:1}}
.board-actions{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.hint{font-size:13px;color:var(--muted);max-width:340px;text-align:center;margin:0}

.results{display:flex;flex-direction:column;gap:16px;min-width:0}
.sel{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px 16px;display:flex;flex-wrap:wrap;gap:6px 20px;align-items:baseline}
.sel .notes-big{font-family:var(--f-mono);font-size:20px;font-weight:600}
.sel .bass{color:var(--muted);font-size:14px}
.res-list{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:10px}
.res{display:flex;flex-direction:column;gap:6px;text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:14px;cursor:pointer}
.res:hover{border-color:var(--accent)}
.res.best{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.res-top{display:flex;justify-content:space-between;align-items:center;gap:8px}
.res-name{font-family:var(--f-display);font-size:24px;font-weight:700;line-height:1.1}
.res-type{font-size:13px;color:var(--muted)}
.res-key{font-size:13px}
.ntones{display:flex;flex-wrap:wrap;gap:6px}
.nt{display:flex;flex-direction:column;align-items:center;min-width:38px;padding:3px 6px;border-radius:8px;background:var(--surface-2);border:1px solid var(--line)}
.nt b{font-family:var(--f-mono);font-size:14px}
.nt small{font-family:var(--f-mono);font-size:11px;color:var(--muted)}
.nt.miss{background:none;border-style:dashed}
.nt.miss b{color:var(--muted)}
.nt.root{border-color:var(--accent)}
.empty{background:var(--surface);border:1px dashed var(--line);border-radius:12px;padding:20px;color:var(--muted);margin:0}
.section-h{display:flex;align-items:baseline;gap:10px}
.section-h h2{font-size:18px}
.more{align-self:flex-start}

/* chord diagram */
.dg{display:block;width:100%;height:auto}
.dg .fret{stroke:var(--fret);stroke-width:1.5}
.dg .nut{fill:var(--nut)}
.dg .str{stroke:var(--string)}
.dg .lab{fill:var(--muted);font:500 11px var(--f-mono)}
.dg .mark{fill:var(--muted);font:500 14px var(--f-mono)}
.dg .open{fill:none;stroke:var(--ink);stroke-width:1.5}
.dg .d{fill:var(--dot)}
.dg .r{fill:var(--accent)}
.dg .num{fill:var(--dot-fg);font:600 11px var(--f-mono)}
.dg .num.rn{fill:var(--accent-fg)}
.dg .nn{fill:var(--ink);font:500 11px var(--f-mono)}

/* library */
.letters{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:20px}
.ltab{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:6px 12px;cursor:pointer;font-family:var(--f-display);font-weight:600;font-size:17px;min-width:48px}
.ltab small{font-family:var(--f-body);font-weight:500;font-size:12px;color:var(--muted);margin-left:2px}
.ltab[aria-selected="true"]{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.ltab[aria-selected="true"] small{color:var(--bg);opacity:.75}
.group{margin-bottom:28px}
.group h2{font-size:18px;margin-bottom:12px}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.card{display:flex;flex-direction:column;gap:4px;border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:12px 10px 10px;cursor:pointer;text-align:left}
.card:hover{border-color:var(--accent)}
.card .dg{max-width:130px;margin:0 auto 4px}
.card-name{font-family:var(--f-display);font-size:19px;font-weight:700;line-height:1.1}
.card-sub{font-size:12px;color:var(--muted)}
.card-notes{font-family:var(--f-mono);font-size:12px}

/* search */
.search-box{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
.search-box input{flex:1 1 260px;min-width:0;font:500 20px var(--f-mono);padding:12px 14px;border:1px solid var(--line);border-radius:10px;background:var(--surface);color:var(--ink)}
.examples{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:24px;align-items:center}
.ex{border:1px solid var(--line);background:none;border-radius:99px;padding:3px 10px;cursor:pointer;font-family:var(--f-mono);font-size:13px}
.ex:hover{border-color:var(--accent);color:var(--accent)}
.search-detail{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:20px;margin-bottom:28px}

/* detail */
.det-head{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;flex-wrap:wrap}
.modal-card .det-head,.modal-card .set h2{padding-right:44px}
.det-name{font-size:40px;font-weight:700;line-height:1}
.det-sub{color:var(--muted);margin:6px 0 0}
.det-desc{max-width:62ch;margin:14px 0 18px}
.det-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:20px;margin-bottom:22px}
.det-grid h3,.det-v h3{font-size:15px;margin-bottom:8px}
.formula{border-collapse:collapse;width:100%;font-size:14px}
.formula td{padding:5px 8px 5px 0;border-bottom:1px solid var(--line)}
.formula td:first-child{font-family:var(--f-mono);color:var(--muted);width:48px}
.formula td:nth-child(2){font-family:var(--f-mono);font-weight:600;width:52px}
.home{margin:0 0 8px}
.keys{list-style:none;padding:0;margin:0;display:flex;flex-direction:column;gap:4px;font-size:14px}
.keys b{font-family:var(--f-mono);display:inline-block;min-width:64px}
.keys small{color:var(--muted)}
.voicings{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:12px}
.vc{margin:0;border:1px solid var(--line);border-radius:12px;padding:12px 10px 10px;background:var(--bg);display:flex;flex-direction:column;gap:8px}
.vc .dg{max-width:150px;margin:0 auto}
.vc figcaption{display:flex;flex-direction:column;gap:6px;font-size:13px}
.vc .shape{font-family:var(--f-mono);color:var(--muted);font-size:12px}
.vc .acts{display:flex;gap:6px;flex-wrap:wrap}
.vc .btn{font-size:12px;padding:4px 9px}

.modal{position:fixed;inset:0;background:rgba(10,12,11,.45);display:flex;align-items:flex-start;justify-content:center;overflow-y:auto;z-index:20;padding:max(24px,env(safe-area-inset-top,0px)) max(12px,env(safe-area-inset-right,0px)) 24px max(12px,env(safe-area-inset-left,0px))}
.modal-card{position:relative;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:24px;width:min(860px,100%)}
.close{position:absolute;top:12px;right:12px;border:0;background:var(--surface-2);width:34px;height:34px;border-radius:50%;cursor:pointer;font-size:18px}
/* keys + circle of fifths */
.keys-wrap{display:grid;grid-template-columns:minmax(0,400px) minmax(0,1fr);gap:28px;align-items:start}
.keys-wrap[hidden]{display:none}
@media (max-width:860px){.keys-wrap{grid-template-columns:minmax(0,1fr)}}
.wheel-col{display:flex;flex-direction:column;align-items:center;gap:10px}
.wheel{width:100%;max-width:400px;display:block;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
.wheel [data-j]{cursor:pointer;outline:none;-webkit-tap-highlight-color:transparent}
.wheel path{stroke:var(--bg);stroke-width:2}
.wheel [data-j]:focus-visible path{stroke:var(--accent);stroke-width:3}
.wheel text{pointer-events:none}
.wheel .s-maj{fill:var(--surface)}
.wheel .s-min{fill:var(--surface-2)}
.wheel .s-dim{fill:var(--inlay)}
.wheel .hl{fill:var(--accent-soft)}
.wheel .ton{fill:var(--accent)}
.wheel .t-maj{font:700 19px var(--f-display);fill:var(--ink)}
.wheel .t-min{font:600 13.5px var(--f-display);fill:var(--ink)}
.wheel .t-dim{font:500 10.5px var(--f-mono);fill:var(--muted)}
.wheel .rn{font:600 10px var(--f-mono);fill:var(--accent)}
.wheel .sig{font:500 10px var(--f-mono);fill:var(--muted)}
.wheel .on{fill:var(--accent-fg)}
.wheel .ctr{fill:var(--surface);stroke:var(--line)}
.wheel .ctr-a{font:700 30px var(--f-display);fill:var(--ink)}
.wheel .ctr-b{font:500 11px var(--f-mono);fill:var(--muted)}
.key-info{display:flex;flex-direction:column;gap:20px;min-width:0}
.key-head h2{font-size:34px;line-height:1.05}
.key-head p{margin:6px 0 0;color:var(--muted)}
.linkbtn{border:0;background:none;padding:0;color:var(--accent);font-weight:600;cursor:pointer;text-decoration:underline;text-underline-offset:3px}
.ctl-row{display:flex;flex-wrap:wrap;gap:10px}
.seg-ctl{display:flex;gap:3px;background:var(--surface-2);border:1px solid var(--line);border-radius:10px;padding:3px}
.seg-ctl button{border:0;background:none;padding:7px 14px;min-height:36px;border-radius:7px;cursor:pointer;font-weight:500;color:var(--muted)}
.seg-ctl button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.08)}
.kc-top{display:flex;justify-content:space-between;align-items:center;gap:4px;margin-bottom:4px}
.kc-rn{font:700 15px var(--f-mono);color:var(--accent)}
.chip.n{background:var(--surface-2);color:var(--muted)}
.progs{display:flex;flex-direction:column;gap:8px}
.prog{display:flex;gap:12px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.prog-name{font-weight:600;font-size:14px}
.prog-chords{display:flex;flex-wrap:wrap;gap:6px;margin-top:4px}
.pc{display:inline-flex;flex-direction:column;align-items:center;padding:3px 8px;border-radius:8px;background:var(--surface-2);font-family:var(--f-mono);font-size:11px;color:var(--muted);min-width:46px}
.pc b{font-size:14px;color:var(--ink)}
.pc.on{background:var(--accent);color:var(--accent-fg)}
.pc.on b{color:var(--accent-fg)}
.play-round{width:44px;height:44px;border-radius:50%;flex:none;justify-content:center;padding:0}

/* scales */
.scards{grid-template-columns:repeat(auto-fill,minmax(200px,1fr))}
.semis{display:grid;grid-template-columns:repeat(12,1fr);gap:2px;margin:6px 0 2px}
.semis i{height:14px;border-radius:3px;background:var(--surface-2);border:1px solid var(--line)}
.semis i.in{background:var(--scale-dot);border-color:var(--scale-dot)}
.semis i.rt{background:var(--accent);border-color:var(--accent)}
.modal-card.wide{width:min(1060px,100%)}
.back{margin-bottom:12px;font-size:14px}
.steps{font-family:var(--f-mono);font-size:14px;margin:12px 0 18px;display:flex;gap:10px;align-items:baseline;flex-wrap:wrap}
.sv-bar{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:10px}
.sv-title{display:flex;align-items:center;gap:8px}
.sv-title span{display:flex;flex-direction:column;line-height:1.25}
.sv-title small{color:var(--muted);font-family:var(--f-mono);font-size:12px}
.sv-tools{display:flex;align-items:center;gap:8px}
.icon-btn{display:inline-flex;align-items:center;justify-content:center;width:40px;height:40px;border:1px solid var(--line);background:var(--surface);border-radius:10px;cursor:pointer;font-size:20px;line-height:1}
.icon-btn svg{width:20px;height:20px;fill:currentColor}
.icon-btn[aria-expanded="true"]{background:var(--surface-2);border-color:var(--muted)}
.menu-wrap{position:relative}
.menu{position:absolute;right:0;top:calc(100% + 6px);z-index:5;min-width:210px;max-height:340px;overflow-y:auto;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:6px;box-shadow:0 10px 30px rgba(0,0,0,.18);display:flex;flex-direction:column}
.menu button{display:flex;justify-content:space-between;align-items:baseline;gap:12px;border:0;background:none;text-align:left;padding:10px 12px;border-radius:8px;cursor:pointer;font-weight:500}
.menu button small{color:var(--muted);font-family:var(--f-mono);font-size:12px}
.menu button:hover{background:var(--surface-2)}
.menu button[aria-checked="true"]{background:var(--accent-soft);color:var(--accent)}
.sboard{overflow-x:auto;-webkit-overflow-scrolling:touch;background:var(--board);border:1px solid var(--line);border-radius:12px;padding:6px 4px}
.sb{display:block;margin:0 auto;max-width:none}
.sb .str{stroke:var(--string)}
.sb .fw{stroke:var(--fret);stroke-width:1.5}
.sb .nutl{stroke:var(--nut);stroke-width:5}
.sb .fn{fill:var(--muted);font:500 13px var(--f-mono)}
.sb .sn{fill:var(--muted);font:500 11px var(--f-mono)}
.sb .inl{fill:var(--muted)}
.sb .sd{fill:var(--scale-dot)}
.sb .rd{fill:var(--accent)}
.sb .lt{fill:var(--scale-fg);font:600 10.5px var(--f-mono)}
.sb .lt.r{fill:var(--accent-fg)}
.sc-chords{margin-top:20px}
.sc-chords h3{font-size:15px;margin-bottom:8px}
.chordchip{cursor:pointer;font:inherit;color:inherit}
.chordchip:hover{border-color:var(--accent)}

/* header tuning chip, left-handed board */
.top-l{display:flex;align-items:center;gap:8px 14px;flex-wrap:wrap;min-width:0}
.tune-chip{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:5px 12px 5px 9px;font-size:13px;color:var(--muted);cursor:pointer;min-height:34px;max-width:100%;text-align:left}
.tune-chip svg{width:16px;height:16px;flex:none;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round}
.tune-chip b{color:var(--ink);font-weight:600}
.tune-chip:hover{border-color:var(--muted)}
.board.lefty .b-seg{direction:rtl}
.board.lefty .b-seg>*{direction:ltr}

/* favourites, detail extras, lazy diagrams */
.icon-btn.star{color:var(--muted)}
.icon-btn.star svg{fill:none;stroke:currentColor;stroke-width:1.6;stroke-linejoin:round}
.icon-btn.star[aria-pressed="true"]{color:var(--star)}
.icon-btn.star[aria-pressed="true"] svg{fill:currentColor}
.det-acts{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.slot{display:block;width:100%;max-width:130px;margin:0 auto 4px;aspect-ratio:158/196}
.nodg{display:flex;align-items:center;justify-content:center;height:100%;font-size:12px;color:var(--muted);text-align:center}
.formula small{color:var(--muted)}
.inv{margin:-6px 0 22px}
.inv h3{font-size:15px;margin-bottom:8px}
.lib-head{display:flex;flex-direction:column;gap:10px;margin-bottom:18px}
.lib-head .search-box,.lib-head .examples{margin:0}
.ltab.fav{color:var(--star)}

/* song */
.song-wrap{display:grid;grid-template-columns:minmax(0,1fr) 330px;gap:28px;align-items:start}
@media (max-width:900px){.song-wrap{grid-template-columns:minmax(0,1fr)}}
.song-main,.song-side{display:flex;flex-direction:column;gap:16px;min-width:0}
.song-side h2{font-size:18px}
.title-in{font:700 26px var(--f-display);border:0;border-bottom:1px dashed var(--line);background:none;color:var(--ink);padding:2px 0;width:100%;min-width:0;border-radius:0}
.title-in:focus{outline:none;border-bottom:1px solid var(--accent)}
.sheet{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
@media (max-width:520px){.sheet{grid-template-columns:repeat(2,minmax(0,1fr))}}
.bar{display:flex;flex-direction:column;align-items:flex-start;gap:2px;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:10px 12px;cursor:pointer;text-align:left;min-height:66px;min-width:0}
.bar b{font:700 22px var(--f-display);line-height:1.1;overflow-wrap:anywhere}
.bar small{font:500 11px var(--f-mono);color:var(--muted)}
.bar[aria-pressed="true"]{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.bar.now{background:var(--accent);border-color:var(--accent);color:var(--accent-fg)}
.bar.now small{color:var(--accent-fg);opacity:.8}
.bar-tools{display:flex;gap:6px;flex-wrap:wrap;align-items:center;background:var(--surface-2);border:1px solid var(--line);border-radius:10px;padding:8px}
.bar-tools b{margin-right:auto;font-family:var(--f-display);padding-left:4px}
.add-row{display:flex;gap:8px}
.txt-in{flex:1;min-width:0;font:500 16px var(--f-mono);padding:9px 12px;border:1px solid var(--line);border-radius:10px;background:var(--surface);color:var(--ink)}
.quick{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.ctl-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:14px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px}
.ctl{display:flex;flex-direction:column;gap:6px;min-width:0}
.ctl .row{display:flex;align-items:center;gap:8px}
.ctl .row output{font:600 15px var(--f-mono);min-width:3ch;text-align:center}
select{font:500 15px var(--f-body);padding:8px 10px;border:1px solid var(--line);border-radius:10px;background:var(--surface);color:var(--ink);min-height:40px;max-width:100%}
input[type=range]{width:100%;accent-color:var(--accent);min-height:28px}
.pat{display:flex;gap:3px;flex-wrap:wrap}
.pat i{font-style:normal;display:flex;align-items:center;justify-content:center;width:24px;height:30px;border-radius:6px;background:var(--surface-2);font:600 15px var(--f-mono);color:var(--muted)}
.pat i.b1{margin-left:6px}
.pat i.b1:first-child{margin-left:0}
.pat i.hit{color:var(--ink);background:var(--inlay)}
.pat i.now{background:var(--accent);color:var(--accent-fg)}
.row-btns{display:flex;gap:8px;flex-wrap:wrap}
.solo{display:flex;flex-direction:column;gap:8px}
.solo-row{display:flex;justify-content:space-between;align-items:center;gap:10px;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:10px 12px;cursor:pointer;text-align:left;width:100%}
.solo-row:hover{border-color:var(--accent)}
.solo-row b{font-family:var(--f-display);font-size:16px}
.solo-row small{display:block;color:var(--muted);font-size:12px}
.fit{font:600 13px var(--f-mono);color:var(--accent);white-space:nowrap}
.fit.low{color:var(--warn)}
.saved{display:flex;flex-direction:column}
.saved-row{display:flex;align-items:center;gap:8px;border-bottom:1px solid var(--line);padding:6px 0}
.saved-row span{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.saved-row small{color:var(--muted);font-family:var(--f-mono)}

/* practice */
.pgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,400px),1fr));gap:16px;align-items:start}
.pcard{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:18px;display:flex;flex-direction:column;gap:14px;min-width:0}
.pcard h2{font-size:20px}
.pcard p{margin:0}
.bpm{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.bpm b{font:700 46px var(--f-display);line-height:1;min-width:2.4ch;text-align:center}
.bpm span{color:var(--muted);font-size:14px}
.round{width:44px;height:44px;border-radius:50%;justify-content:center;padding:0;font-size:22px}
.beats{display:flex;gap:8px;flex-wrap:wrap}
.beats i{width:20px;height:20px;border-radius:50%;background:var(--surface-2);border:1.5px solid var(--line)}
.beats i.acc{border-color:var(--muted)}
.beats i.now{background:var(--accent);border-color:var(--accent)}
/* tuner: an LED display window, after the classic stompbox tuners */
.tn-page{max-width:560px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
.tn-pedal{background:var(--surface);border:1px solid var(--line);border-radius:24px;padding:18px;display:flex;flex-direction:column;gap:14px;
  box-shadow:0 1px 0 var(--line),0 10px 24px -18px rgba(0,0,0,.5)}
.tn-page .refs{display:grid;grid-template-columns:repeat(6,minmax(0,1fr))}
.tn-page .refs .btn{min-width:0;padding-left:0;padding-right:0}
.tn-msg{margin:0;min-height:2.6em;text-align:center;font-size:14px;color:var(--muted)}
.tn-jacks{display:flex;justify-content:space-between;font:600 11px var(--f-mono);letter-spacing:.14em;color:var(--muted);padding:0 4px}
.tn-switch{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;width:100%;min-height:96px;border-radius:16px;cursor:pointer;
  border:1px solid var(--line);color:var(--ink);background-color:var(--surface-2);
  background-image:repeating-linear-gradient(0deg,transparent 0 6px,rgba(0,0,0,.045) 6px 7px);
  box-shadow:inset 0 -4px 0 rgba(0,0,0,.08),inset 0 1px 0 rgba(255,255,255,.06)}
.tn-switch span{font:700 22px var(--f-display)}
.tn-switch small{font:600 11px var(--f-mono);letter-spacing:.12em;text-transform:uppercase;color:var(--accent)}
.tn-switch.on{border-color:var(--accent);box-shadow:inset 0 2px 6px rgba(0,0,0,.15),0 0 0 1px var(--accent)}
.tn-switch:active{transform:translateY(1px);box-shadow:inset 0 2px 6px rgba(0,0,0,.18)}
.tn-switch:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
.tn-win{--lcd:#161b19;--lcd-ink:#e6ebe7;--lcd-lab:#7f8a84;--lcd-off:#2c3431;--led:#f2c14e;--led-ok:#5cc2b5;
  background:var(--lcd);color:var(--lcd-ink);border-radius:14px;padding:12px 14px 14px;
  box-shadow:inset 0 2px 10px rgba(0,0,0,.55),0 0 0 4px var(--surface-2),0 0 0 5px var(--line)}
:root[data-theme="dark"] .tn-win{--lcd:#0b0e0d;--lcd-off:#232a27}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .tn-win{--lcd:#0b0e0d;--lcd-off:#232a27}}
.tn-top{display:flex;align-items:center;justify-content:space-between;font:600 10px var(--f-mono);letter-spacing:.14em;color:var(--lcd-lab)}
.tn-pow{display:flex;align-items:center;gap:6px}
.tn-pow i{width:8px;height:8px;border-radius:50%;background:var(--lcd-off)}
.tn-pow.on i{background:#ef6f5c;box-shadow:0 0 8px #ef6f5c}
.tn-arrows{display:flex;align-items:center;gap:4px;font-size:15px;line-height:1}
.tn-arrows b{color:var(--lcd-off);font-weight:400}
.tn-arrows b.on{color:var(--led);text-shadow:0 0 8px var(--led)}
.tn-arrows.ok b{color:var(--led-ok);text-shadow:0 0 8px var(--led-ok)}
.tn-dial{position:relative;max-width:440px;margin:6px auto 0}
.tn-dial svg{display:block;width:100%;height:auto;overflow:visible}
.tn-dial .seg{stroke:var(--lcd-off);stroke-linecap:round}
.tn-dial .seg.on{stroke:var(--led);filter:drop-shadow(0 0 4px var(--led))}
.tn-dial .seg.on.ok{stroke:var(--led-ok);filter:drop-shadow(0 0 5px var(--led-ok))}
.tn-dial text{fill:var(--lcd-lab);font:600 11px var(--f-mono)}
.tn-note{position:absolute;left:0;right:0;bottom:0;text-align:center;font:700 clamp(56px,19vw,96px)/1 var(--f-mono);color:var(--lcd-off)}
.tn-note.on{color:var(--led);text-shadow:0 0 14px rgba(242,193,78,.45)}
.tn-note.on.ok{color:var(--led-ok);text-shadow:0 0 14px rgba(92,194,181,.45)}
.tn-note sub{font-size:.36em;vertical-align:baseline;margin-left:2px;opacity:.75}
.tn-strs{display:flex;justify-content:center;gap:clamp(6px,3vw,16px);margin-top:12px}
.tn-strs span{display:flex;flex-direction:column;align-items:center;gap:3px;font:600 10px var(--f-mono);color:var(--lcd-lab);min-width:22px}
.tn-strs i{width:9px;height:9px;border-radius:50%;background:var(--lcd-off)}
.tn-strs em{font-style:normal;font-size:12px;color:var(--lcd-ink);opacity:.55}
.tn-strs span.on{color:var(--lcd-ink)}
.tn-strs span.on em{opacity:1}
.tn-strs span.on i{background:var(--led);box-shadow:0 0 7px var(--led)}
.tn-strs span.on.ok i{background:var(--led-ok);box-shadow:0 0 7px var(--led-ok)}
.tn-read{display:flex;justify-content:space-between;gap:10px;margin-top:10px;padding-top:8px;border-top:1px solid var(--lcd-off);font:500 12px var(--f-mono);color:var(--lcd-lab)}
.tn-read b{color:var(--lcd-ink);font-weight:500}
@media (prefers-reduced-motion:no-preference){.tn-dial .seg,.tn-note,.tn-strs i,.tn-arrows b{transition:stroke .1s,color .1s,background .1s}}
.refs{display:flex;gap:6px;flex-wrap:wrap}
.refs .btn{font-family:var(--f-mono);min-width:48px;justify-content:center}
.ans{display:grid;grid-template-columns:repeat(auto-fill,minmax(128px,1fr));gap:8px}
.ans .btn{justify-content:center;min-height:44px;text-align:center}
.ans .btn.right{background:var(--accent-soft);border-color:var(--accent);color:var(--accent)}
.ans .btn.wrong{background:var(--bad-soft);border-color:var(--bad);color:var(--bad)}
.score{font:500 13px var(--f-mono);color:var(--muted)}
.feedback{font-weight:600;min-height:1.5em}
.feedback.ok{color:var(--accent)}
.feedback.no{color:var(--bad)}
.small-note{font-size:13px;color:var(--muted)}

/* settings */
.set{display:flex;flex-direction:column;gap:18px;max-width:600px}
.set h2{font-size:28px}
.set .f{display:flex;flex-direction:column;gap:6px;font-weight:600;font-size:14px}
.custom{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:6px}
.custom select{padding:8px 2px;font-family:var(--f-mono);font-size:14px;text-align:center}
.switch{display:flex;align-items:center;gap:10px;font-weight:600;font-size:14px;cursor:pointer}
.switch input{width:22px;height:22px;accent-color:var(--accent);margin:0}
.set-note{color:var(--muted);font-size:14px;margin:0}

/* phone: iOS-style bottom tab bar, bottom-sheet details, bigger touch targets */
@media (max-width:760px){
  body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
  .top{margin-bottom:14px}
  .brand h1{font-size:24px}
  .tabs{position:fixed;left:0;right:0;bottom:0;z-index:15;border:0;border-top:1px solid var(--line);border-radius:0;background:var(--surface);gap:0;
    padding:4px max(6px,env(safe-area-inset-right,0px)) calc(4px + env(safe-area-inset-bottom,0px)) max(6px,env(safe-area-inset-left,0px))}
  .tab{flex:1;min-width:0;display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 0;font-size:10.5px;font-weight:600}
  .tab svg{display:block}
  .tab[aria-selected="true"]{background:none;box-shadow:none;color:var(--accent)}
  .wrap{padding-bottom:calc(84px + env(safe-area-inset-bottom,0px))}
  .modal{align-items:flex-end;padding:0;overflow:hidden}
  .modal-card{border-radius:18px 18px 0 0;max-height:92vh;max-height:92dvh;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;
    padding:22px max(16px,env(safe-area-inset-right,0px)) calc(28px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
  .det-name{font-size:32px}
  .cards{grid-template-columns:repeat(2,minmax(0,1fr))}
  .res-list{grid-template-columns:minmax(0,1fr)}
  .btn{min-height:40px}
  .vc .btn{min-height:36px}
  .ltab{min-height:42px}
  .key-head h2{font-size:28px}
  .tune-chip{font-size:12px}
  .title-in{font-size:22px}
  .bpm b{font-size:40px}
}
@media (prefers-reduced-motion:no-preference){.res,.card,.btn,.ltab{transition:border-color .15s,background .15s}}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div class="top-l">
      <div class="brand"><h1>Fretwise</h1></div>
      <button class="tune-chip" id="tune-chip" aria-label="Settings: tuning, capo and left-handed mode"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M12 2.5v3M12 18.5v3M4.2 6.2l2.1 2.1M17.7 15.7l2.1 2.1M2.5 12h3M18.5 12h3M4.2 17.8l2.1-2.1M17.7 8.3l2.1-2.1"/></svg><span id="tune-txt"></span></button>
    </div>
    <nav class="tabs" role="tablist">
      <button class="tab" role="tab" id="tab-finder" data-tab="finder"><svg viewBox="0 0 24 24"><rect x="6" y="3" width="12" height="18" rx="2"/><path d="M6 8.5h12M6 14h12M10 3v18M14 3v18"/></svg><span>Finder</span></button>
      <button class="tab" role="tab" id="tab-chords" data-tab="chords"><svg viewBox="0 0 24 24"><rect x="4" y="4" width="7" height="7" rx="1.5"/><rect x="13" y="4" width="7" height="7" rx="1.5"/><rect x="4" y="13" width="7" height="7" rx="1.5"/><circle cx="16.5" cy="16.5" r="3.2"/><path d="M19 19l2 2"/></svg><span>Chords</span></button>
      <button class="tab" role="tab" id="tab-scales" data-tab="scales"><svg viewBox="0 0 24 24"><path d="M3 19h4v-4h4v-4h4V7h4V3"/></svg><span>Scales</span></button>
      <button class="tab" role="tab" id="tab-keys" data-tab="keys"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="4.5"/><path d="M12 3v4.5M12 16.5V21M3 12h4.5M16.5 12H21"/></svg><span>Keys</span></button>
      <button class="tab" role="tab" id="tab-song" data-tab="song"><svg viewBox="0 0 24 24"><path d="M9 18V5l11-2v13"/><circle cx="6.5" cy="18" r="2.5"/><circle cx="17.5" cy="16" r="2.5"/></svg><span>Song</span></button>
      <button class="tab" role="tab" id="tab-practice" data-tab="practice"><svg viewBox="0 0 24 24"><path d="M9 3h6l4 18H5z"/><path d="M12 16l4-9"/><path d="M7.5 15h9"/></svg><span>Practice</span></button>
      <button class="tab" role="tab" id="tab-tuner" data-tab="tuner"><svg viewBox="0 0 24 24"><path d="M9 3v7a3 3 0 0 0 6 0V3"/><path d="M12 13v8"/></svg><span>Tuner</span></button>
    </nav>
  </header>

  <section id="p-finder" class="finder">
    <div class="board-col">
      <div class="board" id="board"></div>
      <div class="board-actions">
        <button class="btn primary" id="strum"><svg viewBox="0 0 16 16"><path d="M4 2.5v11l9-5.5z"/></svg>Strum</button>
        <button class="btn" id="clear">Clear board</button>
      </div>
      <p class="hint">Tap a fret to place a note, tap it again to remove it. Tap × or ○ above the nut to switch a string between muted and open.</p>
    </div>
    <div class="results" id="results"></div>
  </section>

  <section id="p-keys" class="keys-wrap" hidden>
    <div class="wheel-col">
      <svg id="wheel" class="wheel" viewBox="-184 -184 368 368" aria-label="Circle of fifths"></svg>
      <p class="hint">Tap the outer ring for a major key or the middle ring for a minor key. The shaded wedge holds every chord in the selected key.</p>
    </div>
    <div class="key-info" id="keyinfo"></div>
  </section>

  <section id="p-scales" hidden>
    <div class="letters" id="sletters" role="tablist" aria-label="Scale root"></div>
    <div id="slib"></div>
  </section>

  <section id="p-chords" hidden>
    <div class="lib-head">
      <div class="search-box">
        <input id="q" type="search" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" enterkeyhint="search" placeholder="Search, e.g. Am7, F#7b9, D/F#, 13#11, sus" aria-label="Search chords">
      </div>
      <div class="examples"><span class="label">Try</span>
        <button class="ex">F#m7b5</button><button class="ex">E7#9</button><button class="ex">C6/9</button><button class="ex">D/F#</button><button class="ex">Gmaj9#11</button><button class="ex">A13</button><button class="ex">Petrushka</button><button class="ex">So What</button>
      </div>
    </div>
    <div id="browse">
      <div class="letters" id="letters" role="tablist" aria-label="Root note"></div>
      <div id="lib"></div>
    </div>
    <div id="sres" hidden></div>
  </section>

  <section id="p-song" class="song-wrap" hidden></section>

  <section id="p-practice" class="pgrid" hidden>
    <div class="pcard" id="pr-met"></div>
    <div class="pcard" id="pr-strum"></div>
    <div class="pcard" id="pr-ear"></div>
  </section>

  <section id="p-tuner" class="tn-page" hidden></section>
</div>

<div class="modal" id="modal" hidden>
  <div class="modal-card" role="dialog" aria-modal="true" aria-label="Chord details">
    <button class="close" id="close" aria-label="Close">×</button>
    <div id="modal-body"></div>
  </div>
</div>

<script>
// ---------- music theory ----------
const LETTERS = 'CDEFGAB', NAT = [0, 2, 4, 5, 7, 9, 11];
const SHARP = ['C','C#','D','D#','E','F','F#','G','G#','A','A#','B'], FLAT = ['C','Db','D','Eb','E','F','Gb','G','Ab','A','Bb','B'];
// degree -> [semitones, letter steps]
const DEG = {'1':[0,0],'b2':[1,1],'2':[2,1],'#2':[3,1],'#4':[6,3],'b3':[3,2],'3':[4,2],'4':[5,3],'b5':[6,4],'5':[7,4],'#5':[8,4],'b6':[8,5],'6':[9,5],'bb7':[9,6],'b7':[10,6],'7':[11,6],
  'b9':[1,1],'9':[2,1],'#9':[3,1],'11':[5,3],'#11':[6,3],'b13':[8,5],'13':[9,5]};
const DEG_NAME = {'1':'Root','b2':'Minor 2nd','2':'Major 2nd','#2':'Augmented 2nd','b3':'Minor 3rd','3':'Major 3rd','4':'Perfect 4th','#4':'Augmented 4th','b5':'Diminished 5th','5':'Perfect 5th','#5':'Augmented 5th',
  'b6':'Minor 6th','6':'Major 6th','bb7':'Diminished 7th','b7':'Minor 7th','7':'Major 7th','b9':'Minor 9th','9':'Major 9th','#9':'Augmented 9th','11':'Perfect 11th','#11':'Augmented 11th','b13':'Minor 13th','13':'Major 13th'};

  return (pc % 12 + 12) % 12;
}
function spell(root, deg){
  const [semi, off] = DEG[deg];

  const target = (pcOf(root) + semi) % 12;
  let diff = ((target - NAT[li]) % 12 + 12) % 12; if (diff > 6) diff -= 12;
  return LETTERS[li] + (diff > 0 ? '#'.repeat(diff) : 'b'.repeat(-diff));
}
function makeChord(rootName, type){
  const rootPc = pcOf(rootName);
  return {rootName, rootPc, type,
    notes: type.deg.map(d => spell(rootName, d)),
    pcs: type.deg.map(d => (rootPc + DEG[d][0]) % 12),
    name: prettyNote(rootName) + type.suf};
}
function noteNameFor(ch, pc){
  const i = ch ? ch.pcs.indexOf(pc) : -1;
  return i >= 0 ? ch.notes[i] : ROOT_BY_PC[pc].name;
}

// ---------- voicing generator ----------
// Searches 4-fret windows up the neck for playable shapes: the root (or slash bass) on the lowest sounding
// string, no gaps between sounding strings, every required tone present, at most 4 fingers.
// Big chords that do not fit in 4 frets get a second pass with a 5-fret stretch.
function fingering(fr){
  const fretted = [0,1,2,3,4,5].filter(i => fr[i] > 0);
  if (fretted.length <= 4) return {count: fretted.length, barre: null};
  const frets = [...new Set(fretted.map(i => fr[i]))].sort((a, b) => a - b);
  for (const b of frets){
    const at = fretted.filter(i => fr[i] === b);
    if (at.length < 2) continue;
    const from = at[0], to = at[at.length - 1];
    let ok = true;
    for (let i = from; i <= to; i++) if (fr[i] < b){ ok = false; break; }
    if (!ok) continue;
    const count = 1 + fretted.filter(i => !(i >= from && i <= to && fr[i] === b)).length;
    if (count <= 4) return {count, barre: {fret: b, from, to}};
  }

}
function assignFingers(fr, barre){
  const fing = Array(6).fill(null);
  const fretted = [0,1,2,3,4,5].filter(i => fr[i] > 0);
  if (!fretted.length) return fing;
  const minF = Math.min(...fretted.map(i => fr[i]));
  const inBarre = i => barre && i >= barre.from && i <= barre.to && fr[i] === barre.fret;
  const units = [];
  if (barre) units.push({fret: barre.fret, strings: fretted.filter(inBarre), first: barre.from});
  fretted.filter(i => !inBarre(i)).forEach(i => units.push({fret: fr[i], strings: [i], first: i}));
  units.sort((a, b) => a.fret - b.fret || a.first - b.first);
  let next = 1;
  units.forEach((u, k) => {
    const room = 4 - (units.length - k - 1);   // leave a finger for each note still to place
    const f = Math.max(next, Math.min(u.fret - minF + 1, room));
    u.strings.forEach(i => fing[i] = f); next = f + 1;
  });
  return fing;
}
const vCache = {};
function voicings(ch, bassPc){

  if (vCache[key]) return vCache[key];
  const t = ch.type, opt = optDegs(t), all = new Set(ch.pcs); all.add(bass);
  const req = new Set(t.deg.filter(d => !opt.includes(d)).map(d => (ch.rootPc + DEG[d][0]) % 12));
  req.add(bass);
  const optPcs = opt.map(d => [(ch.rootPc + DEG[d][0]) % 12, d === '5' ? 0.5 : 1.2]);
  const minSound = t.id === '5' ? 2 : 4;
  const seen = new Map(), cur = [];
  function evaluate(fr, stretch){
    const snd = fr.filter(f => f >= 0);
    if (snd.length < minSound || (t.id === '5' && snd.length > 3)) return;
    const present = new Set(fr.map((f, i) => f >= 0 ? (TUNING[i] + f) % 12 : -1));
    for (const p of req) if (!present.has(p)) return;
    const k = fr.join(',');
    if (seen.has(k)) return;
    const fg = fingering(fr); if (!fg) return;
    const fretted = fr.filter(f => f > 0);
    const minF = fretted.length ? Math.min(...fretted) : 0, maxF = fretted.length ? Math.max(...fretted) : 0;
    const opens = fr.filter(f => f === 0).length;
    if (opens && maxF > 5) return;   // open strings only make sense near the nut

    if (maxF <= 3) score += opens * 1.5;
    if (maxF >= 4){   // open strings trapped between stretched fretted notes are awkward
      const fi = [0,1,2,3,4,5].filter(i => fr[i] > 0);
      score -= fr.filter((f, i) => f === 0 && i > fi[0] && i < fi[fi.length - 1]).length * 1.5;
    }
    for (const [p, w] of optPcs) if (present.has(p)) score += w;
    if (t.id === '5') score += (2 - fr.findIndex(f => f >= 0)) * 3;   // power chords sit on the low strings
    seen.set(k, {frets: fr, barre: fg.barre, fingers: assignFingers(fr, fg.barre), base: minF, score});
  }

    for (let w = 1; w <= 12; w++){

        if (all.has(o % 12)) list.push(0);
        for (let f = w; f < w + span; f++) if (all.has((o + f) % 12)) list.push(f);
        return list;

        if (s === 6){ if (started) evaluate(cur.slice(), span > 4); return; }
        for (const f of opts[s]){
          if (f === -1){ cur[s] = -1; dfs(s + 1, started, started); continue; }
          if (ended) continue;
          if (!started && (TUNING[s] + f) % 12 !== bass) continue;
          cur[s] = f; dfs(s + 1, true, false);
        }
      })(0, false, false);
    }
  }
  search(4);
  if (seen.size < 2) search(5);
  const sorted = [...seen.values()].sort((a, b) => b.score - a.score);
  const picked = [];
  for (const v of sorted){
    if (picked.length >= 6) break;
    if (picked.some(p => Math.abs(p.base - v.base) < 2)) continue;
    picked.push(v);
  }
  const res = {best: picked[0] || null, list: picked.slice().sort((a, b) => a.base - b.base)};
  vCache[key] = res;
  return res;
}

// ---------- chord diagram (matches the vertical box style; mirrored for left-handed players) ----------
function diagramSVG(v, ch){
  const fr = v.frets;
  const fretted = fr.filter(f => f > 0);
  const maxF = fretted.length ? Math.max(...fretted) : 0, minF = fretted.length ? Math.min(...fretted) : 1;
  const start = maxF <= 5 ? 1 : minF, rows = Math.max(5, maxF - start + 1);
  const L = 32, T = 30, G = 22, R = 28, W = L + 5 * G + 16, H = T + rows * R + 26;
  const x = i => L + (settings.lefty ? 5 - i : i) * G, y = f => T + (f - start + 0.5) * R;
  const aria = `${ch.name} chord, strings low to high: ${fr.map(f => f < 0 ? 'x' : f).join(' ')}`;
  let s = `<svg class="dg" viewBox="0 0 ${W} ${H}" role="img" aria-label="${aria}">`;
  for (let r = 0; r <= rows; r++) s += `<line class="fret" x1="${L}" x2="${L + 5 * G}" y1="${T + r * R}" y2="${T + r * R}"/>`;
  if (start === 1) s += `<rect class="nut" x="${L - 1}" y="${T - 5}" width="${5 * G + 2}" height="6"/>`;
  for (let i = 0; i < 6; i++) s += `<line class="str" x1="${x(i)}" x2="${x(i)}" y1="${T}" y2="${T + rows * R}" stroke-width="${(2 - i * 0.2).toFixed(1)}"/>`;
  for (let r = 0; r < rows; r++) s += `<text class="lab" x="${L - 12}" y="${T + (r + 0.5) * R + 4}" text-anchor="end">${start + r}</text>`;
  for (let i = 0; i < 6; i++){
    if (fr[i] === -1) s += `<text class="mark" x="${x(i)}" y="${T - 12}" text-anchor="middle">×</text>`;
    else if (fr[i] === 0) s += `<circle class="open" cx="${x(i)}" cy="${T - 16}" r="5"/>`;
  }
  if (v.barre){
    const b = v.barre, x0 = Math.min(x(b.from), x(b.to));
    s += `<rect class="d" x="${x0 - 10}" y="${y(b.fret) - 10}" width="${Math.abs(x(b.to) - x(b.from)) + 20}" height="20" rx="10"/>`;
  }
  for (let i = 0; i < 6; i++){
    if (fr[i] <= 0) continue;
    const isRoot = (TUNING[i] + fr[i]) % 12 === ch.rootPc;
    s += `<circle class="${isRoot ? 'r' : 'd'}" cx="${x(i)}" cy="${y(fr[i])}" r="10"/>`;
    if (v.fingers[i]) s += `<text class="num${isRoot ? ' rn' : ''}" x="${x(i)}" y="${y(fr[i]) + 4}" text-anchor="middle">${v.fingers[i]}</text>`;
  }
  for (let i = 0; i < 6; i++){
    if (fr[i] < 0) continue;
    s += `<text class="nn" x="${x(i)}" y="${H - 7}" text-anchor="middle">${prettyNote(noteNameFor(ch, (TUNING[i] + fr[i]) % 12))}</text>`;
  }
  return s + '</svg>';
}

// ---------- keys ----------
function keysFor(ch){
  const out = [];
  for (let k = 0; k < 12; k++){
    const sc = MAJ.map(m => (m + k) % 12);
    if (!ch.pcs.every(p => sc.includes(p))) continue;
    const d = sc.indexOf(ch.rootPc);
    let rn = ROMAN[d];
    if (ch.type.deg.includes('b3')) rn = rn.toLowerCase();
    out.push({d, rn: rn + ch.type.num, major: KEY_MAJ[k], minor: KEY_MIN[(k + 9) % 12]});
  }
  return out.sort((a, b) => a.d - b.d);
}
function homeKey(ch){
  const t = ch.type, id = t.id, r = ch.rootPc, root = prettyNote(ch.rootName), has = d => t.deg.includes(d);
  if (id === '5' || id === '5add9') return `No third, so it works in both <b>${root} major</b> and <b>${root} minor</b>.`;
  if (id === 'quartal') return `Built in fourths with no third, so it fits <b>${root} Dorian</b>, <b>${root} Mixolydian</b> and many other keys.`;
  if (isDominant(t)) return `Dominant (V) chord. It pulls toward <b>${KEY_MAJ[(r + 5) % 12]} major</b> or <b>${KEY_MIN[(r + 5) % 12]} minor</b>.`;
  if (has('b3') && has('b5') && has('b7')) return `Usually the ii chord in <b>${KEY_MIN[(r + 10) % 12]} minor</b>.`;
  if (has('b3') && has('b5')) return `Leading-tone chord. It pulls up a half step toward <b>${KEY_MAJ[(r + 1) % 12]}</b>.`;
  if (!has('3') && !has('b3')) return `Neither major nor minor. Often resolves to <b>${root}</b> or <b>${root}m</b>.`;
  if (has('b3')) return `Home key: <b>${root} minor</b>.`;
  if (has('#11') || has('b5')) return `The ♯4 points to <b>${root} Lydian</b>, the IV chord of <b>${KEY_MAJ[(r + 7) % 12]} major</b>.`;
  return `Home key: <b>${root} major</b>.`;
}
function inversionLabel(ch, bassPc){
  if (bassPc === ch.rootPc) return 'root position';
  const d = ch.type.deg[ch.pcs.indexOf(bassPc)];
  if (d === '3' || d === 'b3') return '1st inversion';
  if (d === '5' || d === 'b5' || d === '#5') return '2nd inversion';
  if (d && d.endsWith('7')) return '3rd inversion';
  return `${prettyNote(noteNameFor(ch, bassPc))} in the bass`;
}

// ---------- audio ----------
let actx = null, master = null, audioStale = false;
// Karplus-Strong plucked string: a short noise burst fed through a tuned delay loop.
// Rich in harmonics, so low strings stay audible on phone speakers.
function ksData(midi, sr){
  const hz = 440 * 2 ** ((midi - 69) / 12), len = Math.floor(sr * 2.8);
  const N = Math.max(2, Math.round(sr / hz - 0.5));      // loop length; the averaging adds half a sample
  const rho = Math.pow(10, -3 / (3 * hz));               // about 3 s to fade 60 dB at any pitch
  const d = new Float32Array(len);
  let prev = 0, mean = 0, peak = 0;
  for (let i = 0; i < N; i++){ prev = 0.55 * prev + 0.45 * (Math.random() * 2 - 1); d[i] = prev; mean += prev / N; }
  for (let i = 0; i < N; i++){ d[i] -= mean; peak = Math.max(peak, Math.abs(d[i])); }
  for (let i = 0; i < N; i++) d[i] *= 0.8 / (peak || 1);
  for (let i = N; i < len; i++) d[i] = rho * 0.5 * (d[i - N] + (i > N ? d[i - N - 1] : 0));
  return d;
}
const ksCache = {}, voices = [];
function ksBuffer(midi){
  if (!ksCache[midi]){
    const d = ksData(midi, actx.sampleRate), b = actx.createBuffer(1, d.length, actx.sampleRate);
    b.getChannelData(0).set(d); ksCache[midi] = b;
  }
  return ksCache[midi];
}
// t is an absolute AudioContext time; len cuts the note short (for muted, choppy strums)
function pluckAt(midi, t, string, vel = 0.55, len){
  if (string != null && voices[string]){   // a re-plucked string stops its old note, like a real guitar
    const v = voices[string];
    v.g.gain.setTargetAtTime(0, t, 0.015);
    try { v.src.stop(t + 0.12); } catch (e) {}
  }
  const src = actx.createBufferSource(), g = actx.createGain();
  src.buffer = ksBuffer(midi); g.gain.value = vel;
  src.connect(g).connect(master); src.start(t);
  if (len){ g.gain.setTargetAtTime(0, t + len, 0.03); src.stop(t + len + 0.3); }

const pluck = (midi, when, string, vel, len) => pluckAt(midi, actx.currentTime + when, string, vel, len);
// iOS only unlocks audio inside a tap, and the "playback" session lets it sound with the silent switch on.
// After the microphone was used or the app was in the background, iOS can leave the old context silent
// even when it says it is running, so it is rebuilt on the next tap instead of resumed.
function audio(){
  try {
    if (actx && (audioStale || actx.state === 'closed' || actx.state === 'interrupted')){
      clockStop();
      try { actx.close(); } catch (e) {}
      actx = null; voices.length = 0;
    }
    if (!actx){
      audioStale = false;
      if (navigator.audioSession && !tun.on) navigator.audioSession.type = 'playback';
      actx = new (window.AudioContext || window.webkitAudioContext)();
      master = actx.createDynamicsCompressor();   // keeps six summed strings from clipping
      master.connect(actx.destination);
      for (const k in ksCache) if (ksCache[k].sampleRate !== actx.sampleRate) delete ksCache[k];
    }
    if (actx.state !== 'running'){
      const p = actx.resume();
      if (p && p.catch) p.catch(() => { audioStale = true; });
    }
    // a one-sample silent sound started inside the tap is what unlocks output on some iOS versions
    const s = actx.createBufferSource();
    s.buffer = actx.createBuffer(1, 1, actx.sampleRate); s.connect(actx.destination); s.start();
  } catch (e) {}

// iOS stops web audio in the background; start fresh when the app comes back
document.addEventListener('visibilitychange', () => { if (document.hidden && actx){ clockStop(); audioStale = true; } });
function play(fr, single){
  try {
    if (!audio()) return;
    if (single != null){ pluck(TUNING[single] + fr[single], 0, single); return; }
    let k = 0;
    fr.forEach((f, i) => { if (f >= 0) pluck(TUNING[i] + f, 0.045 * k++, i); });
  } catch (e) {}

// one strum at time t. D = down, U = up (top strings), B = bass note only, C = chord without the bass
function strumAt(fr, t, dir, vel = 0.5, len){
  let idx = [0,1,2,3,4,5].filter(i => fr[i] >= 0);
  if (!idx.length) return;
  if (dir === 'B') idx = idx.slice(0, 1);
  else if (dir === 'C') idx = idx.slice(1);
  else if (dir === 'U') idx = idx.reverse().slice(0, Math.max(3, idx.length - 2));
  const gap = dir === 'U' ? 0.009 : 0.014;
  idx.forEach((i, k) => pluckAt(TUNING[i] + fr[i], t + k * gap, i, vel * (dir === 'U' ? 0.7 : 1), len));

// metronome click: level 2 = accented first beat, 1 = beat, 0 = subdivision
function clickAt(t, level){

  o.frequency.value = [750, 1000, 1500][level];
  g.gain.setValueAtTime(0.0001, t);
  g.gain.exponentialRampToValueAtTime([0.25, 0.5, 0.7][level], t + 0.002);
  g.gain.exponentialRampToValueAtTime(0.0001, t + 0.06);
  o.connect(g).connect(master); o.start(t); o.stop(t + 0.08);

// Shared clock for the song player, metronome and strumming practice. Steps are scheduled a little
// ahead on the audio clock, so timing stays tight even when the page is busy. Only one owner plays at a time.
let clk = null, clkGen = 0;
function clockStart(owner, stepDur, onStep, onStop){
  clockStop();
  if (!audio()) return;
  clk = {owner, stepDur, onStep, onStop, next: actx.currentTime + 0.1, i: 0};
  clk.timer = setInterval(clockTick, 25);
  clockTick();
}
function clockTick(){
  if (!clk) return;
  while (clk && clk.next < actx.currentTime + 0.12){
    clk.onStep(clk.i, clk.next);
    if (!clk) return;
    clk.next += clk.stepDur(); clk.i++;

const playing = owner => clk && clk.owner === owner;
// run fn when the audio clock reaches t (for highlighting); skipped if the clock was stopped meanwhile
function atTime(t, fn){
  const g = clkGen;
  setTimeout(() => { if (g === clkGen) fn(); }, Math.max(0, (t - actx.currentTime) * 1000));

// ---------- finder ----------
const NUM_FRETS = 12;
let frets = [-1, -1, 5, 4, 3, 2];   // example: the shape from the reference picture
let showAll = false;
const boardEl = document.getElementById('board');

  for (let f = 1; f <= NUM_FRETS; f++){
    const ht = (50 - f * 1.3).toFixed(1);

    if (f === 12) inlay = '<i class="inlay" style="left:33.33%"></i><i class="inlay" style="left:66.67%"></i>';
    h += `<div class="b-row b-fret" style="height:${ht}px"><span class="b-lab">${f}</span><div class="b-seg">${inlay}${[0,1,2,3,4,5].map(s => {
      const pc = (TUNING[s] + f) % 12;
      return `<button class="b-cell" data-s="${s}" data-f="${f}" style="--sw:${(2.6 - s * 0.32).toFixed(2)}px" aria-label="${STRING_LONG[s]} string, fret ${f}, ${prettyNote(ROOT_BY_PC[pc].name)}"><span class="ghost">${prettyNote(ROOT_BY_PC[pc].name)}</span></button>`;
    }).join('')}</div></div>`;
  }
  h += `<div class="b-row b-foot"><span class="b-lab"></span><div class="b-seg" id="foot">${'<span></span>'.repeat(6)}</div></div>`;

boardEl.addEventListener('click', e => {
  const b = e.target.closest('button'); if (!b) return;
  const s = +b.dataset.s;
  if (b.dataset.f === 'top') frets[s] = frets[s] === -1 ? 0 : -1;
  else { const f = +b.dataset.f; frets[s] = frets[s] === f ? -1 : f; }

document.getElementById('clear').onclick = () => { frets = [-1,-1,-1,-1,-1,-1]; updateFinder(); };
document.getElementById('strum').onclick = () => play(frets);

function findMatches(fr){
  const snd = fr.map((f, i) => f >= 0 ? (TUNING[i] + f) % 12 : null).filter(p => p !== null);
  const sel = new Set(snd);
  const bass = snd.length ? snd[0] : null;
  const exact = [], partial = [];
  if (sel.size < 2) return {sel, bass, exact, partial, closest: []};
  for (const r of ROOTS) for (const t of TYPES){
    if (t.id === '5' && sel.size !== 2) continue;
    const ch = makeChord(r.name, t);
    if (![...sel].every(p => ch.pcs.includes(p))) continue;
    const opt = optDegs(t);
    const missAll = t.deg.filter((d, i) => !sel.has(ch.pcs[i]));
    const missing = missAll.filter(d => !opt.includes(d)), omitted = missAll.filter(d => opt.includes(d));
    const score = -missing.length * 12 - omitted.length * 4 + (r.pc === bass ? 14 : 0) - t.deg.length * 1.5 - (t.rare ? 5 : 0);
    (missing.length ? partial : exact).push({ch, missing, omitted, score});
  }
  exact.sort((a, b) => b.score - a.score); partial.sort((a, b) => b.score - a.score);
  let closest = [];
  if (!exact.length && !partial.length){
    for (const r of ROOTS) for (const t of TYPES){
      if (t.id === '5') continue;
      const ch = makeChord(r.name, t);
      const hit = [...sel].filter(p => ch.pcs.includes(p));
      const extra = [...sel].filter(p => !ch.pcs.includes(p));
      const missing = t.deg.filter((d, i) => !sel.has(ch.pcs[i]));
      closest.push({ch, extra, missing, score: hit.length * 10 - missing.length * 4 + (r.pc === bass ? 6 : 0) - (t.rare ? 3 : 0) - t.deg.length});
    }
    closest = closest.sort((a, b) => b.score - a.score).slice(0, 6);
  }
  return {sel, bass, exact, partial, closest};
}

const ordinal = d => prettyDeg(d).replace(/\d+$/, n => n + (n === '1' ? 'st' : n === '2' ? 'nd' : n === '3' ? 'rd' : 'th'));

    const have = sel.has(ch.pcs[i]);

    const lab = !have && omitted && omitted.includes(d) ? prettyDeg(d) + ' (opt.)' : prettyDeg(d);

function resultCard(m, sel, bass, kind, best){

  const chip = kind === 'exact' ? `<span class="chip ok">${m.omitted.length ? 'Match, no ' + m.omitted.map(ordinal).join(', ') : 'Exact match'}</span>`
    : kind === 'partial' ? `<span class="chip part">Add ${m.missing.map(d => prettyNote(ch.notes[ch.type.deg.indexOf(d)])).join(', ')}</span>`

  const keys = keysFor(ch);
  const keyLine = keys.length ? `${keys.length} major key${keys.length > 1 ? 's' : ''}, e.g. <b>${keys[0].rn}</b> in ${keys[0].major}` : 'Outside every major key';

function updateFinder(){
  const {sel, bass, exact, partial, closest} = findMatches(frets);
  const top = exact[0]?.ch || null;
  // board state
  boardEl.querySelectorAll('.b-top').forEach(b => {
    const s = +b.dataset.s;
    b.textContent = frets[s] === -1 ? '×' : frets[s] === 0 ? '○' : '';
    b.classList.toggle('open', frets[s] === 0);
    b.setAttribute('aria-label', `${STRING_LONG[s]} string: ${frets[s] === -1 ? 'muted' : frets[s] === 0 ? 'open' : 'fretted'}. Click to ${frets[s] === -1 ? 'play open' : 'mute'}.`);
  });
  boardEl.querySelectorAll('.b-cell').forEach(b => {
    const s = +b.dataset.s, f = +b.dataset.f;
    const old = b.querySelector('.dot'); if (old) old.remove();
    b.setAttribute('aria-pressed', frets[s] === f);
    if (frets[s] === f){
      const pc = (TUNING[s] + f) % 12;
      const d = document.createElement('span');
      d.className = 'dot' + (top && pc === top.rootPc ? ' root' : '');
      d.textContent = prettyNote(noteNameFor(top, pc));
      b.appendChild(d);
    }
  });
  document.querySelectorAll('#foot span').forEach((sp, s) => {
    sp.textContent = frets[s] >= 0 ? prettyNote(noteNameFor(top, (TUNING[s] + frets[s]) % 12)) : '–';
    sp.classList.toggle('off', frets[s] < 0);
  });

  // results
  const out = document.getElementById('results');
  const uniq = [...sel].map(pc => prettyNote(noteNameFor(top, pc)));
  let h = `<div class="sel"><span class="label">Your notes</span><span class="notes-big">${uniq.join(' ') || '—'}</span>${bass !== null ? `<span class="bass">Bass: ${prettyNote(noteNameFor(top, bass))}</span>` : ''}</div>`;
  if (sel.size === 0) h += `<p class="empty">Tap frets on the board to add notes. Each string holds one note, the same as a real guitar.</p>`;
  else if (sel.size === 1) h += `<p class="empty">One note is not a chord yet. Add at least one more note on another string.</p>`;
  else {
    if (exact.length){
      h += `<div class="section-h"><h2>Matching chords</h2><span class="label">${exact.length} found</span></div><div class="res-list">${exact.map((m, i) => resultCard(m, sel, bass, 'exact', i === 0)).join('')}</div>`;
    } else if (partial.length) {
      h += `<p class="empty">No chord uses exactly these notes. The chords below contain all of them, plus the notes shown with a dashed outline.</p>`;
    }
    if (partial.length){
      const lim = showAll ? partial.length : 6;
      h += `<div class="section-h"><h2>${exact.length ? 'Bigger chords that contain these notes' : 'Chords that contain these notes'}</h2><span class="label">${partial.length}</span></div>
        <div class="res-list">${partial.slice(0, lim).map(m => resultCard(m, sel, bass, 'partial')).join('')}</div>`;
      if (partial.length > lim) h += `<button class="btn more" id="more">Show ${partial.length - lim} more</button>`;
    }
    if (closest.length){
      h += `<p class="empty">No chord in the library contains all of these notes. These are the closest, with the number of your notes that fall outside the chord.</p>
        <div class="res-list">${closest.map(m => resultCard(m, sel, bass, 'closest')).join('')}</div>`;
    }
  }
  out.innerHTML = h;
  const more = document.getElementById('more');
  if (more) more.onclick = () => { showAll = true; updateFinder(); };
}

function norm(s){ return s.replace(/♯/g, '#').replace(/♭/g, 'b').replace(/\s+/g, ''); }
// "F#m7b5" -> {root:'F#', type:m7b5}; "D/F#" -> bass 'F#'; null if it does not start with a note
function parseQuery(q){
  const s = norm(q);
  const m = s.match(/^([A-Ga-g])(#|b)?(.*)$/);
  if (!m) return null;
  const root = m[1].toUpperCase() + (m[2] || '');
  let rest = m[3], bass = null;
  const sl = rest.match(/^(.*)\/([A-Ga-g][#b]?)$/);
  if (sl){ rest = sl[1]; bass = sl[2][0].toUpperCase() + sl[2].slice(1); }
  rest = rest.replace(/^major/i, 'maj').replace(/^minor/i, 'm');
  const forms = t => [t.ascii, ...t.al];
  let type = TYPES.find(t => forms(t).includes(rest));
  if (!type) type = TYPES.find(t => forms(t).some(f => f.toLowerCase() === rest.toLowerCase() && f !== 'M'));
  return {root, rest, bass, type};
}
const parseChord = sym => { const p = parseQuery(sym); return p && p.type ? {ch: makeChord(p.root, p.type), bass: p.bass} : null; };
const qEl = document.getElementById('q'), sres = document.getElementById('sres'), browseEl = document.getElementById('browse');

// ---------- keys & circle of fifths ----------
const CIRCLE_MAJ = ['C','G','D','A','E','B','F#','Db','Ab','Eb','Bb','F'];
const CIRCLE_MIN = ['A','E','B','F#','C#','G#','D#','Bb','F','C','G','D'];
const KEY_DEF = {
  maj: {deg:['1','2','3','4','5','6','7'], tri:['maj','m','m','maj','maj','m','dim'], sev:['maj7','m7','m7','maj7','7','m7','m7b5'],
        rn:['I','ii','iii','IV','V','vi','vii°'], rn7:['Imaj7','ii7','iii7','IVmaj7','V7','vi7','viiø7'],
        fn:['Tonic','Subdominant','Tonic','Subdominant','Dominant','Tonic','Dominant']},
  min: {deg:['1','2','b3','4','5','b6','b7'], tri:['m','dim','maj','m','m','maj','maj'], sev:['m7','m7b5','maj7','m7','m7','maj7','7'],
        rn:['i','ii°','III','iv','v','VI','VII'], rn7:['i7','iiø7','IIImaj7','iv7','v7','VImaj7','VII7'],
        fn:['Tonic','Subdominant','Tonic','Subdominant','Dominant','Subdominant','Dominant']},
};
// index 7 in a minor key is the major V borrowed from harmonic minor
const PROGS = {
  maj: [{name:'Pop', d:[0,4,5,3]}, {name:'1950s', d:[0,5,3,4]}, {name:'Three-chord', d:[0,3,4,0]}, {name:'Sad pop', d:[5,3,0,4]}, {name:'Jazz ii–V–I', d:[1,4,0], sev:true}],
  min: [{name:'Epic minor', d:[0,5,2,6]}, {name:'Andalusian', d:[0,6,5,7]}, {name:'Minor rock', d:[0,3,6,2]}, {name:'i–iv–V', d:[0,3,7,0]}, {name:'Minor ii–V–i', d:[1,7,0], sev:true}],
};
let keyIdx = 0, keyMode = 'maj', keySev = false, progTimers = [];
const sigShort = i => i === 0 ? '0' : i < 6 ? i + '♯' : i === 6 ? '6♯/6♭' : (12 - i) + '♭';
const sigLong = i => i === 0 ? 'No sharps or flats' : i < 6 ? `${i} sharp${i > 1 ? 's' : ''}` : i === 6 ? '6 sharps, or 6 flats as G♭' : `${12 - i} flat${12 - i > 1 ? 's' : ''}`;
const tonicName = () => (keyMode === 'maj' ? CIRCLE_MAJ : CIRCLE_MIN)[keyIdx];

function keyChords(sev){
  const def = KEY_DEF[keyMode], tonic = tonicName();
  const list = def.deg.map((d, i) => ({ch: makeChord(spell(tonic, d), TYPE_BY_ID[(sev ? def.sev : def.tri)[i]]), rn: (sev ? def.rn7 : def.rn)[i], fn: def.fn[i]}));
  if (keyMode === 'min') list.push({ch: makeChord(spell(tonic, '5'), TYPE_BY_ID[sev ? '7' : 'maj']), rn: sev ? 'V7' : 'V', fn: 'Dominant', extra: true});
  return {tonic, list};
}

function wheelHTML(){
  const P = (r, a) => [+(r * Math.sin(a)).toFixed(2), +(-r * Math.cos(a)).toFixed(2)];
  const sector = (r1, r2, a0, a1) => { const [x0,y0] = P(r2,a0), [x1,y1] = P(r2,a1), [x2,y2] = P(r1,a1), [x3,y3] = P(r1,a0);

const SCALE_BY_ID = {}; SCALES.forEach(s => SCALE_BY_ID[s.id] = s);

function makeScale(rootName, sc){

// Positions: walk up the scale from the root on the low E string, giving each string the next
// 3 notes (2 for pentatonic scales). This yields the standard 3-notes-per-string and pentatonic box shapes.
// Alternate tunings break the 3-notes-per-string walk (it assumes strings a 4th apart), so they use
// fret boxes instead: every scale note inside a 4-fret window (5 for pentatonics), one box per scale note on the low string.
function boxPositions(s){
  const lo = TUNING[0], first = (s.rootPc - lo % 12 + 12) % 12, span = s.pcs.length >= 7 ? 3 : 4;
  const ppcs = s.sc.parent ? makeScale(s.rootName, SCALE_BY_ID[s.sc.parent]).pcs : s.pcs;
  const out = [];
  for (let f = first; out.length < ppcs.length && f < first + 12; f++){
    if (!ppcs.includes((lo + f) % 12)) continue;
    const a = f > 12 ? f - 12 : f, notes = [];
    for (let st = 0; st < 6; st++) for (let g = a; g <= a + span; g++) if (s.pcs.includes((TUNING[st] + g) % 12)) notes.push({s: st, f: g, m: TUNING[st] + g});
    out.push(notes.sort((x, y) => x.m - y.m));
  }
  return out;
}
function scalePositions(s){
  if (TUNING.some((m, i) => m - TUNING[0] !== STD[i] - STD[0])) return boxPositions(s);
  const parent = s.sc.parent ? makeScale(s.rootName, SCALE_BY_ID[s.sc.parent]) : s;
  const ppcs = parent.pcs, extras = s.pcs.filter(p => !ppcs.includes(p));
  const nps = ppcs.length <= 6 ? 2 : 3;
  const lo = TUNING[0], asc = []; for (let m = lo; m <= lo + 48; m++) if (ppcs.includes(m % 12)) asc.push(m);
  const rootIdx = asc.indexOf(lo + (s.rootPc - lo % 12 + 12) % 12);

      else n++;

    let notes = build(rootIdx + k);

// horizontal fretboard, high e on top (tab orientation)
function scaleBoardSVG(s, notes, from, to, labels){

  for (let k = 0; k <= n; k++){
    const x = X(nutX + k * CW);

  }
  for (let f = first; f <= to; f++){
    o += `<text class="fn" x="${cx(f)}" y="${T - 14}" text-anchor="middle">${f}</text>`;
    if ([3,5,7,9,15,17,19,21].includes(f)) o += `<circle class="inl" cx="${cx(f)}" cy="${H - 12}" r="3"/>`;
    if (f === 12 || f === 24) o += `<circle class="inl" cx="${cx(f) - 6}" cy="${H - 12}" r="3"/><circle class="inl" cx="${cx(f) + 6}" cy="${H - 12}" r="3"/>`;
  }

    const pc = (TUNING[nt.s] + nt.f) % 12, root = pc === s.rootPc;

function openScale(rootName, sc){

  {id:'boom', name:'Boom-chick (country)', sub:2, seq:'B-C-B-C-'},

const patById = id => PATTERNS.find(p => p.id === id) || PATTERNS[3];

const patHTML = (p, owner) => `<div class="pat" data-pat="${owner}" aria-label="Strum pattern: ${p.name}">${[...p.seq].map((c, i) =>

function patStep(pat, st, fr, t, bpm){

const shapeOf = p => p ? (voicings(p.ch, p.bass ? pcOf(p.bass) : null).best || {}).frets : null;
const symName = p => p.ch.name + (p.bass ? '/' + prettyNote(p.bass) : '');

function transposeSym(sym, n){

// Scales for soloing, ranked by how many chord tones they contain (roots and 3rds count double)
const SOLO_SCALES = ['major','minor','majpent','minpent','blues','majblues','dorian','mixo','phrygian','lydian','harm','mel','phrygdom','lyddom'];
function songTones(list){
  const w = [], names = {};
  list.forEach(({ch, bass}) => {
    ch.type.deg.forEach((d, i) => { w.push([ch.pcs[i], d === '1' || d === '3' || d === 'b3' ? 2 : 1]); names[ch.pcs[i]] = names[ch.pcs[i]] || ch.notes[i]; });
    if (bass){ w.push([pcOf(bass), 1]); names[pcOf(bass)] = names[pcOf(bass)] || bass; }
  });
  return {w, names, total: w.reduce((a, x) => a + x[1], 0)};
}
function scaleFit(s, tones){
  const set = new Set(s.pcs);
  const got = tones.w.reduce((a, x) => a + (set.has(x[0]) ? x[1] : 0), 0);
  return {s, fit: got / tones.total, outside: [...new Set(tones.w.filter(x => !set.has(x[0])).map(x => tones.names[x[0]]))], same: []};
}
function soloSuggestions(list){
  if (!list.length) return [];
  const tones = songTones(list);
  const first = list[0].ch.rootPc, last = list[list.length - 1].ch.rootPc;
  const out = [];
  for (let pc = 0; pc < 12; pc++) for (const id of SOLO_SCALES){
    const sc = SCALE_BY_ID[id], x = scaleFit(makeScale(scaleRootName(pc, sc), sc), tones);
    x.score = x.fit + (pc === first ? 0.04 : 0) + (pc === last ? 0.02 : 0) + (sc.g <= 1 ? 0.01 : 0);
    out.push(x);
  }
  out.sort((a, b) => b.score - a.score);
  // scales with the same notes (G major, E minor, A Dorian...) collapse into the best-placed one
  const bySet = new Map();
  for (const x of out){
    const k = x.s.pcs.slice().sort((a, b) => a - b).join(',');
    if (bySet.has(k)) bySet.get(k).same.push(x.s.name); else bySet.set(k, x);
  }
  return [...bySet.values()];
}
function songKey(sugg){
  for (const x of sugg){
    if (x.s.sc.id === 'major' || x.s.sc.id === 'minor') return x;
    const m = x.same.find(n => / (major|minor)$/.test(n));   // e.g. "D Mixolydian" grouped with "G major"
    if (m) return {s: makeScale(m.split(' ')[0].replace('♯', '#').replace('♭', 'b'), SCALE_BY_ID[m.endsWith('major') ? 'major' : 'minor'])};
  }
}

function markBar(i){ songEl.querySelectorAll('.bar').forEach((b, k) => b.classList.toggle('now', k === i)); }
function songPlayBtn(){ const b = songEl.querySelector('[data-s="play"]'); if (b) b.innerHTML = playing('song') ? '■ Stop' : PLAY_ICON + 'Play song'; }
function playSong(){
  if (playing('song')){ clockStop(); return; }
  if (!song.chords.length) return;
  clockStart('song', () => 60 / song.bpm / patById(song.pat).sub, (i, t) => {
    const pat = patById(song.pat), n = song.chords.length;
    if (!n){ clockStop(); return; }
    const L = pat.seq.length, bar = Math.floor(i / L) % n, st = i % L;
    if (st === 0) atTime(t, () => markBar(bar));
    atTime(t, () => markStep('song', st));
    patStep(pat, st, shapeOf(parseChord(song.chords[bar])), t, song.bpm);
  }, () => { markBar(-1); markStep('song', -1); songPlayBtn(); });

}
function chartText(){
  const names = song.chords.map(c => { const p = parseChord(c); return p ? symName(p) : c; });
  const lines = []; for (let i = 0; i < names.length; i += 4) lines.push('| ' + names.slice(i, i + 4).join(' | ') + ' |');
  const key = songKey(soloSuggestions(song.chords.map(parseChord).filter(Boolean)));
  return `${song.name}\n${key ? 'Key: ' + key.s.name + ' · ' : ''}${song.bpm} bpm · ${patById(song.pat).name}${settings.capo ? ' · capo ' + settings.capo : ''}\n\n${lines.join('\n')}\n`;
}
function copyText(text){
  const fallback = () => {
    const ta = document.createElement('textarea'); ta.value = text; ta.setAttribute('readonly', ''); ta.style.position = 'fixed'; ta.style.opacity = '0';
    document.body.appendChild(ta); ta.select(); let ok = false;
    try { ok = document.execCommand('copy'); } catch (e) {}
    ta.remove(); return ok;
  };
  if (navigator.clipboard && navigator.clipboard.writeText) return navigator.clipboard.writeText(text).then(() => true, () => fallback());
  return Promise.resolve(fallback());
}
songEl.addEventListener('click', e => {
  const b = e.target.closest('button'); if (!b) return;
  if (b.dataset.bar){
    const i = +b.dataset.bar; songSel = songSel === i ? -1 : i;
    const fr = shapeOf(parseChord(song.chords[i])); if (fr && !playing('song')) play(fr);
    renderSong(); return;
  }
  if (b.dataset.add){ addToSong(b.dataset.add); return; }
  if (b.dataset.sid){ openScale(b.dataset.sroot, SCALE_BY_ID[b.dataset.sid]); return; }
  if (b.dataset.load){ const x = songs[+b.dataset.load]; song = JSON.parse(JSON.stringify(x)); songSel = -1; storeSong(); renderSong(); window.scrollTo({top: 0}); return; }
  if (b.dataset.delsong){   // two taps to delete, so a stray tap does not lose a song
    if (!b.dataset.armed){ b.dataset.armed = 1; b.textContent = 'Tap again'; setTimeout(() => { if (b.isConnected){ delete b.dataset.armed; b.textContent = 'Delete'; } }, 2500); return; }
    songs.splice(+b.dataset.delsong, 1); storeSong(); renderSong(); return;
  }
  const a = b.dataset.s, sel = songSel;
  if (a === 'play') return playSong();
  if (a === 'left' || a === 'right'){
    const j = sel + (a === 'left' ? -1 : 1);
    [song.chords[sel], song.chords[j]] = [song.chords[j], song.chords[sel]]; songSel = j;
  }
  else if (a === 'dup'){ song.chords.splice(sel + 1, 0, song.chords[sel]); songSel = sel + 1; }
  else if (a === 'del'){ song.chords.splice(sel, 1); songSel = -1; }
  else if (a === 'shapes'){ const p = parseChord(song.chords[sel]); if (p) openDetail(p.ch, p.bass); return; }
  else if (a === 'up' || a === 'down') song.chords = song.chords.map(c => transposeSym(c, a === 'up' ? 1 : -1));
  else if (a === 'copy'){
    copyText(chartText()).then(ok => { b.textContent = ok ? 'Copied' : 'Copy failed'; setTimeout(() => { b.textContent = 'Copy chord chart'; }, 1600); });
    return;
  }
  else if (a === 'save'){
    const name = song.name.trim() || 'Untitled song', i = songs.findIndex(x => x.name === name);

    return;
  }
  else if (a === 'new'){ if (playing('song')) clockStop(); song = {name:'Untitled song', bpm:song.bpm, pat:song.pat, chords:[]}; songSel = -1; }

});
songEl.addEventListener('submit', e => {

// YIN pitch detection: finds the repeat period of the waveform, which handles the strong
// overtones of a guitar string better than picking the loudest FFT peak.
function yin(buf, sr){
  let rms = 0; for (let i = 0; i < buf.length; i++) rms += buf[i] * buf[i];
  if (Math.sqrt(rms / buf.length) < 0.008) return -1;
  const W = buf.length >> 1, maxTau = Math.min(W - 2, Math.floor(sr / 55)), minTau = Math.floor(sr / 1100);
  const d = new Float32Array(maxTau + 2);
  for (let tau = 1; tau <= maxTau + 1; tau++){
    let s = 0;
    for (let i = 0; i < W; i++){ const x = buf[i] - buf[i + tau]; s += x * x; }
    d[tau] = s;
  }
  d[0] = 1; let run = 0;
  for (let tau = 1; tau <= maxTau + 1; tau++){ run += d[tau]; d[tau] = run ? d[tau] * tau / run : 1; }
  let tau = -1;
  for (let t = minTau; t <= maxTau; t++){
    if (d[t] < 0.12){ while (t + 1 <= maxTau && d[t + 1] < d[t]) t++; tau = t; break; }
  }
  if (tau < 1) return -1;
  const a = d[tau - 1], b = d[tau], c = d[tau + 1], den = a + c - 2 * b;
  return sr / (tau + (den ? (a - c) / (2 * den) : 0));
}
const tun = {on: false, hist: [], miss: 0, last: 0};
const tunEl = document.getElementById('p-tuner');
// the LED arc: 21 segments, 5 cents apart, from -50 to +50 across 120 degrees
function tunerDial(){
  const P = (r, k) => { const a = (k - 10) * 6 * Math.PI / 180; return [(150 + r * Math.sin(a)).toFixed(1), (162 - r * Math.cos(a)).toFixed(1)]; };
  let h = '';
  for (let k = 0; k <= 20; k++){
    const mid = k === 10, [x1, y1] = P(mid ? 96 : 106, k), [x2, y2] = P(mid ? 138 : k % 5 ? 126 : 132, k);
    h += `<line class="seg" x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke-width="${mid ? 8 : 5.5}"/>`;
  }
  [[0, '−50'], [5, '−25'], [10, '0'], [15, '+25'], [20, '+50']].forEach(([k, t]) => {
    const [x, y] = P(150, k); h += `<text x="${x}" y="${y}" text-anchor="middle" dominant-baseline="middle">${t}</text>`;
  });
  return `<svg viewBox="0 0 300 165" aria-hidden="true">${h}</svg>`;
}

async function startTuner(){
  if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia){ renderTuner('This browser does not allow microphone access on this page.'); return; }
  // the microphone gets its own context, made here inside the tap so iOS lets it run. Playback stays on
  // the main context, which is rebuilt afterwards because opening the mic changes the iPhone's audio hardware.
  let ctx;
  try {
    ctx = new (window.AudioContext || window.webkitAudioContext)();
    if (ctx.state !== 'running') ctx.resume();
    if (navigator.audioSession) navigator.audioSession.type = 'play-and-record';
    tun.stream = await navigator.mediaDevices.getUserMedia({audio: {echoCancellation: false, noiseSuppression: false, autoGainControl: false}});
  } catch (e) {
    if (ctx) try { ctx.close(); } catch (e2) {}
    if (navigator.audioSession) navigator.audioSession.type = 'playback';
    audioStale = true;
    renderTuner('The microphone could not be opened on this page. Allow microphone access for this site in your browser settings and try again. (The preview on claude.ai cannot use the microphone; the installed app can.)');
    return;
  }
  clockStop(); audioStale = true;
  tun.ctx = ctx;
  if (ctx.state !== 'running') ctx.resume();
  tun.src = ctx.createMediaStreamSource(tun.stream);
  tun.an = ctx.createAnalyser(); tun.an.fftSize = 4096;
  tun.src.connect(tun.an);
  tun.buf = new Float32Array(tun.an.fftSize);
  tun.on = true; tun.hist = []; renderTuner(); tunLoop();
}
function stopTuner(){
  tun.on = false; cancelAnimationFrame(tun.raf);
  if (tun.stream) tun.stream.getTracks().forEach(t => t.stop());
  if (tun.src) tun.src.disconnect();
  if (tun.ctx) try { tun.ctx.close(); } catch (e) {}
  tun.stream = tun.src = tun.ctx = null;
  if (navigator.audioSession) navigator.audioSession.type = 'playback';
  audioStale = true;
  renderTuner();
}
function tunLoop(){
  if (!tun.on) return;
  tun.raf = requestAnimationFrame(tunLoop);
  const now = Date.now(); if (now - tun.last < 70) return; tun.last = now;
  tun.an.getFloatTimeDomainData(tun.buf);
  const hz = yin(tun.buf, tun.ctx.sampleRate);
  if (hz > 0){ tun.hist.push(hz); if (tun.hist.length > 5) tun.hist.shift(); tun.miss = 0; }
  else if (++tun.miss > 8) tun.hist = [];
  const sorted = tun.hist.slice().sort((a, b) => a - b);
  showPitch(sorted.length ? sorted[sorted.length >> 1] : 0);
}
function showPitch(hz){
  const note = document.getElementById('tn-note');
  if (!note) return;
  const segs = tunEl.querySelectorAll('.seg'), strs = tunEl.querySelectorAll('.tn-strs span'), arrows = document.getElementById('tn-arrows');
  segs.forEach(x => x.classList.remove('on', 'ok')); strs.forEach(x => x.classList.remove('on', 'ok'));
  arrows.classList.remove('ok'); arrows.querySelectorAll('b').forEach(x => x.classList.remove('on'));
  if (!hz){ note.classList.remove('on', 'ok'); note.textContent = '–'; document.getElementById('tn-cents').textContent = '–'; document.getElementById('tn-hz').textContent = '–'; return; }
  const mf = 69 + 12 * Math.log2(hz / 440), m = Math.round(mf), c = Math.round((mf - m) * 100), ok = Math.abs(c) <= 5;
  note.innerHTML = `${prettyNote(SHARP[m % 12])}<sub>${Math.floor(m / 12) - 1}</sub>`;
  note.classList.add('on'); note.classList.toggle('ok', ok);
  const seg = segs[Math.max(0, Math.min(20, Math.round(c / 5) + 10))];
  seg.classList.add('on'); seg.classList.toggle('ok', ok);
  if (ok) arrows.classList.add('ok');
  else arrows.querySelector(c < 0 ? '[data-a="flat"]' : '[data-a="sharp"]').classList.add('on');   // ▶ tune up, ◀ tune down
  document.getElementById('tn-cents').textContent = (c > 0 ? '+' : '') + c + ' cents';
  document.getElementById('tn-hz').textContent = hz.toFixed(1) + ' Hz';
  let s = 0; BASE.forEach((b, i) => { if (Math.abs(mf - b) < Math.abs(mf - BASE[s])) s = i; });
  const d = Math.round((mf - BASE[s]) * 100);
  if (Math.abs(d) < 150){ strs[s].classList.add('on'); strs[s].classList.toggle('ok', Math.abs(d) <= 5); }
  document.getElementById('tn-str').textContent = Math.abs(d) < 150
    ? `String ${6 - s} (${prettyNote(noteOct(BASE[s]))}): ${Math.abs(d) <= 5 ? 'in tune' : d < 0 ? `${-d} cents flat, tune up` : `${d} cents sharp, tune down`}`

}
