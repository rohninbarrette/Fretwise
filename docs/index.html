const earEl = document.getElementById('pr-ear');
function earItems(){
  const d = EAR[ear.mode][ear.level];
  if (ear.mode === 'int') return d.map(([s, n]) => ({id: String(s), label: n}));
  if (ear.mode === 'chord') return d.map(id => ({id, label: TYPE_BY_ID[id].name}));
  return d.map(id => ({id, label: SCALE_BY_ID[id].full}));
}
function newQ(){
  const items = earItems(); let it;
  do it = items[Math.floor(Math.random() * items.length)]; while (ear.q && it.id === ear.q.id && Math.random() < 0.7);
  ear.q = {id: it.id, root: 48 + Math.floor(Math.random() * 12)}; ear.picked = null;
}
function earPlay(){
  if (!audio()) return;
  if (!ear.q) newQ();
  const {id, root} = ear.q;
  if (ear.mode === 'int'){
    const top = root + +id;
    pluck(root, 0, null, 0.6); pluck(top, 0.75, null, 0.6); pluck(root, 1.6, null, 0.45); pluck(top, 1.6, null, 0.45);
  } else if (ear.mode === 'chord'){
    const n = TYPE_BY_ID[id].deg.map(d => root + DEG[d][0] + (['b9','9','#9','11','#11','b13','13'].includes(d) ? 12 : 0));
    n.forEach((m, k) => pluck(m, k * 0.16, null, 0.5));
    n.forEach((m, k) => pluck(m, n.length * 0.16 + 0.6 + k * 0.02, null, 0.4));
  } else {
    SCALE_BY_ID[id].deg.map(d => root + DEG[d][0]).concat(root + 12).forEach((m, k) => pluck(m, k * 0.3, null, 0.55));
  }
}

  const answer = q && items.find(x => x.id === q.id);
  const rootName = q ? prettyNote(ROOT_BY_PC[q.root % 12].name) : '';
  const fb = !done ? '' : ear.picked === q.id ? `<p class="feedback ok">Correct: ${answer.label}${ear.mode === 'int' ? '' : ' on ' + rootName}.</p>`

    <div class="row-btns"><button class="btn primary" data-ear="play">${PLAY_ICON}${q ? 'Hear it again' : 'Play a question'}</button>${done ? '<button class="btn" data-ear="next">Next question</button>' : ''}</div>
    <div class="ans">${items.map(it => {

  modalBody.innerHTML = `<div class="set"><h2>Settings</h2>
    <label class="f">Tuning<select id="set-tuning">${groups.map(g => `<optgroup label="${g}">${TUNINGS.filter(t => t.g === g).map(t =>
      `<option value="${t.id}" ${t.id === TUNE.id ? 'selected' : ''}>${t.name}${t.notes ? ' · ' + t.notes.map(m => prettyNote((t.fl ? FLAT : SHARP)[m % 12])).join(' ') : ''}</option>`).join('')}</optgroup>`).join('')}</select></label>
    ${TUNE.id === 'custom' ? `<div class="f"><span>Custom tuning, low string to high string</span><div class="custom">${settings.custom.map((m, i) =>
      `<select data-cs="${i}" aria-label="String ${6 - i}">${Array.from({length: 14}, (_, k) => STD[i] - 8 + k).map(n => `<option value="${n}" ${n === m ? 'selected' : ''}>${prettyNote(noteOct(n))}</option>`).join('')}</select>`).join('')}</div></div>` : ''}
    <label class="f">Capo<select id="set-capo">${Array.from({length: 10}, (_, k) => `<option value="${k}" ${k === settings.capo ? 'selected' : ''}>${k ? 'Fret ' + k : 'No capo'}</option>`).join('')}</select></label>
    <label class="switch"><input type="checkbox" id="set-lefty" ${settings.lefty ? 'checked' : ''}> Left-handed (mirror the fretboard and chord diagrams)</label>
    <p class="set-note">Open strings sound as <b>${TUNING.map(m => prettyNote(noteOct(m))).join(' ')}</b>. The finder, chord shapes, scale positions and tuner all follow this setting. With a capo, fret numbers count up from the capo and chord names are the notes that actually sound.</p>
    <div><button class="btn" data-reset>Back to standard tuning</button></div>
  </div>`;
  modalBody.onclick = e => {
    if (!e.target.closest('[data-reset]')) return;
    settings = {tuning:'std', custom:settings.custom, capo:0, lefty:settings.lefty};
    settingsChanged('set-tuning');
  };
}
function settingsChanged(focusId){
  saveSettings(); applySettings(); updateHeader();
  if (playing('song') || playing('strum')) clockStop();
  buildBoard(); updateFinder();
  const cur = TAB_NAMES.find(n => !document.getElementById('p-' + n).hidden);
  for (const k in rendered) delete rendered[k];
  setTab(cur || 'finder');
  renderSettings();
  const f = focusId && modalBody.querySelector(focusId.startsWith('[') ? focusId : '#' + focusId);
  if (f) f.focus();
}
modalBody.addEventListener('change', e => {
  if (!e.target.closest('.set')) return;
  const t = e.target;
  if (t.id === 'set-tuning') settings.tuning = t.value;
  else if (t.id === 'set-capo') settings.capo = +t.value;
  else if (t.id === 'set-lefty') settings.lefty = t.checked;
  else if (t.dataset.cs){ settings.custom = settings.custom.slice(); settings.custom[+t.dataset.cs] = +t.value; }
  else return;
  settingsChanged(t.id || `[data-cs="${t.dataset.cs}"]`);
});
document.getElementById('tune-chip').onclick = () => { renderSettings(); showModal(false, 'Settings'); };

// ---------- tabs ----------
const rendered = {}, TAB_NAMES = ['finder', 'chords', 'scales', 'keys', 'song', 'practice', 'tuner'];
const RENDER = {chords: () => { renderLibrary(); renderSearch(); }, scales: renderScales, keys: renderKeys, practice: renderPractice, tuner: renderTuner};
function setTab(name){
  if (name !== 'tuner' && tun.on) stopTuner();   // frees the microphone and puts playback back to normal
  TAB_NAMES.forEach(n => {
    document.getElementById('p-' + n).hidden = n !== name;
    document.getElementById('tab-' + n).setAttribute('aria-selected', n === name);
  });
  if (name === 'song') renderSong();   // cheap, and picks up chords added from other tabs
  else if (RENDER[name] && !rendered[name]){ RENDER[name](); rendered[name] = 1; }
  try { localStorage.setItem('fretwise-tab', name); } catch (e) {}
}
document.querySelector('.tabs').addEventListener('click', e => { const b = e.target.closest('[data-tab]'); if (b){ setTab(b.dataset.tab); window.scrollTo({top: 0}); } });

applySettings();
updateHeader();
buildBoard();
updateFinder();
let startTab = 'finder';
const hash = location.hash.slice(1), OLD_TABS = {library: 'chords', search: 'chords'};
let lastTab = null; try { lastTab = localStorage.getItem('fretwise-tab'); } catch (e) {}
if (TAB_NAMES.includes(OLD_TABS[hash] || hash)) startTab = OLD_TABS[hash] || hash;
else if (TAB_NAMES.includes(lastTab)) startTab = lastTab;
setTab(startTab);
</script>
<script>if ('serviceWorker' in navigator) addEventListener('load', () => navigator.serviceWorker.register('sw.js'));</script>
</body>
</html>
